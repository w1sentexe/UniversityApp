name: Build and Deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: backend

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1

  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify image and Excel import before merge
        run: |
          docker build -t vsuet-schedule-check .
          docker run --rm --network none --user 1000:1000 --tmpfs /data:rw,mode=1777 \
            -e PARSING_YEAR=test -e PARSING_SEMESTER=0 \
            vsuet-schedule-check python -c \
            "import sqlite3; db = sqlite3.connect('/data/rating.sqlite3'); assert db.execute('SELECT COUNT(*) FROM group_schedule').fetchone()[0] > 0"

  build_and_push:
    needs: lint
    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calculate next version
        id: version
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          echo "version=1.0.$((GITHUB_RUN_NUMBER - 1))" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    needs: build_and_push
    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            set -e

            cd "${{ secrets.VPS_PROJECT_PATH }}"

            git fetch origin main
            git reset --hard "${{ github.sha }}"

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

            export IMAGE_TAG=${{ needs.build_and_push.outputs.version }}
            export BACKEND_IMAGE=${{ needs.build_and_push.outputs.image }}

            docker compose -f docker-compose.prod.yml pull app
            # Entrypoint applies the ready schedule before starting the API.
            docker compose -f docker-compose.prod.yml up -d --no-deps --wait --wait-timeout 120 app
            printf 'BACKEND_IMAGE=%s\nIMAGE_TAG=%s\n' "$BACKEND_IMAGE" "$IMAGE_TAG" > .deploy-image.env

            # Recreate to remount nginx.conf after git reset and resolve the new app address.
            docker compose -f docker-compose.prod.yml up -d --force-recreate --no-deps nginx
            echo "==> Validating and reloading nginx"
            for attempt in 1 2 3 4 5; do
              if docker compose -f docker-compose.prod.yml exec -T nginx nginx -t; then
                break
              fi
              if [ "$attempt" = "5" ]; then
                exit 1
              fi
              sleep 2
            done

            for attempt in 1 2 3 4 5; do
              if docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload; then
                break
              fi
              if [ "$attempt" = "5" ]; then
                exit 1
              fi
              sleep 2
            done

            echo "==> Smoke checks"
            for attempt in 1 2 3 4 5; do
              if curl --retry 3 --retry-delay 2 --retry-all-errors -fsS https://universityapp.site/notifications/status >/dev/null; then
                break
              fi
              if [ "$attempt" = "5" ]; then
                exit 1
              fi
              sleep 2
            done

            for attempt in 1 2 3 4 5; do
              if curl --retry 3 --retry-delay 2 --retry-all-errors -fsSI https://universityapp.site/js/view-settings.js | grep -qi 'cache-control: no-cache'; then
                break
              fi
              if [ "$attempt" = "5" ]; then
                exit 1
              fi
              sleep 2
            done

            docker image prune -f
